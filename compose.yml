version: "3.8"

services:
  app:
    # image: docker.io/library/php:8.4-apache
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: laravel_app_cuoiki
    ports:
      - "8001:80"
    depends_on:
      - db
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=root
      - DB_PASSWORD=root123
    networks:
      - laravel_net_cuoiki

  db:
    image: docker.io/library/mysql:8.4.7
    container_name: laravel_mysql_cuoiki
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - mysql-data:/var/lib/mysql:z
    ports:
      - "33066:3306"   # mở port ra host nếu cần connect tool bên ngoài
    networks:
      - laravel_net_cuoiki

# --- PHẦN BỔ SUNG PHPMYADMIN ---
  phpmyadmin:
    image: docker.io/library/phpmyadmin:latest
    container_name: laravel_phpmyadmin_cuoiki
    ports:
      - "8002:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=root123
    depends_on:
      - db
    networks:
      - laravel_net_cuoiki

volumes:
  mysql-data:

networks:
  laravel_net_cuoiki:
    driver: bridge